<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de Productos</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #4575d4;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 40px;
      }

      .form-container {
        width: 100%;
        max-width: 600px;
        background: white;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }

      .form-title {
        text-align: center;
        margin-bottom: 30px;
        color: #111827;
        font-size: 28px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #374151;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 14px;
        border: 1px solid #d1d5db;
        border-radius: 12px;
        font-size: 16px;
        transition: 0.3s ease;
        outline: none;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
      }

      textarea {
        resize: vertical;
        min-height: 100px;
      }

      .btn {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 12px;
        background: #4f46e5;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.3s ease;
      }

      .btn:hover {
        background: #4338ca;
      }
    </style>
  </head>

  <body>
    <div class="form-container">
      <h2 class="form-title">Registrar Producto</h2>

      <form>
        <div class="form-group">
          <label for="producto">Nombre del producto</label>
          <input type="text" id="producto" placeholder="Ej: Laptop HP" />
        </div>

        <div class="form-group">
          <label for="categoria">Categoría</label>
          <select id="categoria">
            <option>Tecnología</option>
            <option>Audio</option>
            <option>Periféricos</option>
            <option>Accesorios</option>
            <option>Pantallas</option>
          </select>
        </div>

        <div class="form-group">
          <label for="precio">Precio</label>
          <input type="number" id="precio" placeholder="Ej: 250" />
        </div>

        <div class="form-group">
          <label for="stock">Stock</label>
          <input type="number" id="stock" placeholder="Ej: 10" />
        </div>

        <div class="form-group">
          <label for="descripcion">Descripción</label>
          <textarea
            id="descripcion"
            placeholder="Describe el producto..."
          ></textarea>
        </div>

        <button type="submit" class="btn">Guardar Producto</button>
      </form>
    </div>
  </body>
</html>
